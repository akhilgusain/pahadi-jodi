# Local dev infrastructure only. Apps run via `make run-*` (or your IDE).
# All credentials here are LOCAL-ONLY defaults; real secrets are injected via env/Secrets Manager (see .env.example).
name: pahadi-jodi
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pahadijodi
      POSTGRES_USER: ${DB_USER:-pj}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pj_local_only}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pj} -d pahadijodi"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  kafka:
    image: apache/kafka:3.8.0        # KRaft single node
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # dev only
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
volumes:
  pgdata:
