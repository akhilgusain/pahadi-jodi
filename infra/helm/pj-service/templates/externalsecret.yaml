{{- if and .Values.externalSecret.enabled .Values.externalSecret.data }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "pj.name" . }}
  labels: {{- include "pj.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef: {kind: ClusterSecretStore, name: {{ .Values.externalSecret.store }}}
  target: {name: {{ include "pj.name" . }}, creationPolicy: Owner}
  data: {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end }}
