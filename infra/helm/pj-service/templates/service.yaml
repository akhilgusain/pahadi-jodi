apiVersion: v1
kind: Service
metadata:
  name: {{ include "pj.name" . }}
  labels: {{- include "pj.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  {{- if eq .Values.service.sessionAffinity "ClientIP" }}
  sessionAffinityConfig: {clientIP: {timeoutSeconds: 10800}}
  {{- end }}
  selector: {{- include "pj.selector" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
    - {name: management, port: {{ .Values.managementPort }}, targetPort: management}
