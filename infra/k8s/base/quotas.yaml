apiVersion: v1
kind: ResourceQuota
metadata: {name: compute, namespace: pj-gateway}
spec:
  hard: {requests.cpu: "40", requests.memory: 80Gi, limits.memory: 160Gi, pods: "200"}
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: pj-gateway}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 256Mi}
      default: {memory: 512Mi}
      max: {cpu: "4", memory: 8Gi}
---
