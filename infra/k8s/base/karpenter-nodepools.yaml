apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata: {name: default}
spec:
  amiSelectorTerms: [{alias: bottlerocket@latest}]
  role: pj-prod-node
  subnetSelectorTerms: [{tags: {karpenter.sh/discovery: pj-prod}}]
  securityGroupSelectorTerms: [{tags: {karpenter.sh/discovery: pj-prod}}]
  blockDeviceMappings: [{deviceName: /dev/xvdb, ebs: {volumeSize: 50Gi, volumeType: gp3, encrypted: true}}]
  metadataOptions: {httpTokens: required, httpPutResponseHopLimit: 1}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata: {name: general}
spec:
  template:
    metadata: {labels: {pj/pool: general}}
    spec:
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: default}
      requirements:
        - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand, spot]}
        - {key: kubernetes.io/arch, operator: In, values: [arm64]}
        - {key: karpenter.k8s.aws/instance-family, operator: In, values: [m7g, c7g, m6g, c6g]}
        - {key: karpenter.k8s.aws/instance-size, operator: In, values: [large, xlarge, 2xlarge]}
      expireAfter: 336h
  limits: {cpu: 1000}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
    budgets: [{nodes: "10%"}, {nodes: "0", schedule: "0 13 * * *", duration: 4h}]  # no voluntary disruption at evening IST peak
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata: {name: ai-gpu}
spec:
  template:
    metadata: {labels: {pj/pool: ai-gpu}}
    spec:
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: default}
      taints: [{key: nvidia.com/gpu, value: "true", effect: NoSchedule}]
      requirements:
        - {key: karpenter.sh/capacity-type, operator: In, values: [spot, on-demand]}
        - {key: karpenter.k8s.aws/instance-family, operator: In, values: [g5, g6]}
  limits: {cpu: 64}
  disruption: {consolidationPolicy: WhenEmpty, consolidateAfter: 5m}
