apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata: {name: pj-success-rate}
spec:
  args: [{name: service}]
  metrics:
    - name: success-rate
      interval: 1m
      count: 5
      successCondition: result[0] >= 0.995
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-operated.observability:9090
          query: |
            sum(rate(http_server_requests_seconds_count{service="{{args.service}}",status!~"5..",rollout_role="canary"}[2m]))
            / sum(rate(http_server_requests_seconds_count{service="{{args.service}}",rollout_role="canary"}[2m]))
---
apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata: {name: pj-p95-latency}
spec:
  args: [{name: service}, {name: maxSeconds, value: "0.4"}]
  metrics:
    - name: p95
      interval: 1m
      count: 5
      successCondition: result[0] <= {{args.maxSeconds}}
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-operated.observability:9090
          query: |
            histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{service="{{args.service}}",rollout_role="canary"}[2m])))
