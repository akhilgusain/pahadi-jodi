server:
  port: 8081
spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pahadijodi}
    username: ${DB_USER:pj}
    password: ${DB_PASSWORD:pj_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # Flyway is the source of truth
    properties:
      hibernate.default_schema: identity
  flyway:
    schemas: identity
    create-schemas: true
    locations: classpath:db/migration,classpath:db/outbox
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
management:
  endpoints.web.exposure.include: health,info,prometheus
pj:
  jwt:
    issuer: ${PJ_JWT_ISSUER:http://localhost:8081}
    access-ttl-seconds: 900
    refresh-ttl-days: 30
    # PKCS#8 PEM. Leave empty in local dev: an ephemeral key is generated (tokens die on restart).
    private-key-pem: ${PJ_JWT_PRIVATE_KEY_PEM:}
  outbox:
    relay:
      enabled: ${PJ_OUTBOX_RELAY:true}
