server:
  port: 8091
spring:
  application:
    name: media-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pahadijodi}
    username: ${DB_USER:pj}
    password: ${DB_PASSWORD:pj_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: media
  flyway:
    schemas: media
    create-schemas: true
    locations: classpath:db/migration,classpath:db/outbox
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: media-service
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PJ_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
management:
  endpoints.web.exposure.include: health,info,prometheus
pj:
  kafka:
    consumers:
      enabled: ${PJ_KAFKA_CONSUMERS:true}
  outbox:
    relay:
      enabled: ${PJ_OUTBOX_RELAY:true}
  media:
    provider: ${PJ_MEDIA_PROVIDER:fake}          # fake = local filesystem. (real S3 adapter: not implemented yet)
    storage-dir: ${PJ_MEDIA_STORAGE_DIR:${java.io.tmpdir}/pj-media}
    signing-secret: ${PJ_MEDIA_SIGNING_SECRET:dev-only-change-me}
    public-base-url: ${PJ_MEDIA_PUBLIC_BASE_URL:}  # prefixed to signed URLs, e.g. https://api.example.com
    url-ttl-seconds: 300
    max-photos: 10
  scan:
    provider: ${PJ_SCAN_PROVIDER:fake}
  kyc:
    provider: ${PJ_KYC_PROVIDER:fake}
    hash-pepper: ${PJ_KYC_HASH_PEPPER:dev-only-pepper}
  face:
    provider: ${PJ_FACE_PROVIDER:fake}
  verification:
    liveness-min: 0.85
    match-pass: 0.80
    match-review: 0.60
    max-attempts: 5
