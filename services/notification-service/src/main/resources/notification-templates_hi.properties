WELCOME.title=पहाड़ी जोड़ी में आपका स्वागत है
WELCOME.body=गढ़वाल और कुमाऊँ के रिश्ते पाने के लिए अपनी प्रोफ़ाइल बनाइए।
INTEREST_RECEIVED.title=कोई आपमें रुचि रखता है
INTEREST_RECEIVED.body=आपको एक नई रुचि मिली है। प्रोफ़ाइल देखने और जवाब देने के लिए पहाड़ी जोड़ी खोलें।
INTEREST_ACCEPTED.title=आपकी रुचि स्वीकार हुई
INTEREST_ACCEPTED.body=खुशखबरी! आपकी रुचि स्वीकार कर ली गई है। अब आप बात कर सकते हैं।
MATCH_CREATED.title=यह एक मैच है!
MATCH_CREATED.body=आप और एक अन्य सदस्य आपस में मैच हैं। चैट में नमस्ते कहें।
NEW_MESSAGE.title=नया संदेश
NEW_MESSAGE.body=आपके लिए एक नया संदेश आया है।
PAYMENT_SUCCESS.title=भुगतान प्राप्त हुआ
PAYMENT_SUCCESS.body=हमें आपका {amount} का भुगतान मिल गया है। धन्यवाद!
SUBSCRIPTION_EXPIRED.title=आपका प्लान समाप्त हो गया
SUBSCRIPTION_EXPIRED.body=आपकी सदस्यता समाप्त हो गई है। चैट और प्रीमियम सुविधाओं के लिए नवीनीकरण करें।
PROFILE_VERIFIED.title=प्रोफ़ाइल सत्यापित
PROFILE_VERIFIED.body=आपकी प्रोफ़ाइल सत्यापित हो गई है। अब सदस्यों को आपका वेरिफ़ाइड बैज दिखेगा।
