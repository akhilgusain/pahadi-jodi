server:
  port: 8092
spring:
  application:
    name: moderation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pahadijodi}
    username: ${DB_USER:pj}
    password: ${DB_PASSWORD:pj_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: moderation
  flyway:
    schemas: moderation
    create-schemas: true
    locations: classpath:db/migration,classpath:db/outbox
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: moderation-service
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PJ_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
management:
  endpoints.web.exposure.include: health,info,prometheus
pj:
  kafka:
    consumers:
      enabled: ${PJ_KAFKA_CONSUMERS:true}
  outbox:
    relay:
      enabled: ${PJ_OUTBOX_RELAY:true}
  moderation:
    classifier:
      provider: ${PJ_MODERATION_CLASSIFIER:fake}   # fake = rule based; real (LLM) adapter not implemented yet
    thresholds:
      flag: 0.5
      block: 0.85
    image:
      sample-rate: 0.1      # fraction of uploaded photos routed to human spot-check
    strikes:
      expiry-days: 180
      temp-7d-points: 3
      temp-30d-points: 5
      permanent-points: 8
