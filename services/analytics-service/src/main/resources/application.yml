server:
  port: 8094
spring:
  application:
    name: analytics-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pahadijodi}
    username: ${DB_USER:pj}
    password: ${DB_PASSWORD:pj_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: analytics
  flyway:
    schemas: analytics
    create-schemas: true
    locations: classpath:db/migration,classpath:db/outbox
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: analytics-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        metadata.max.age.ms: 30000     # discover new pj.* topics within 30 s (pattern subscription)
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PJ_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
management:
  endpoints.web.exposure.include: health,info,prometheus
pj:
  kafka:
    consumers:
      enabled: ${PJ_KAFKA_CONSUMERS:true}
  outbox:
    relay:
      enabled: ${PJ_OUTBOX_RELAY:true}      # analytics publishes nothing yet; the outbox starter is on the classpath
  analytics:
    store: jpa                               # jpa (SQL on this service's schema). A ClickHouse adapter implements the same AnalyticsStore port later.
    timezone: Asia/Kolkata                   # business day boundary
    # HMAC key used to pseudonymise user ids. REQUIRED in production: changing it breaks joins with history.
    # Generate: openssl rand -base64 32
    pseudonym-key: ${PJ_ANALYTICS_PSEUDONYM_KEY:}
    require-pseudonym-key: ${PJ_ANALYTICS_REQUIRE_KEY:false}
    rollup-cron: "0 5 * * * *"              # recompute recent daily rollups hourly
    dev-ingest:
      enabled: false                         # POST /api/v1/analytics/dev/ingest. Never enable in production.
    entitlements:
      provider: ${PJ_ENTITLEMENTS_PROVIDER:fake}   # fake | real (calls subscription-service)
      fake-plan: PREMIUM_PLUS
      subscription-url: ${SUBSCRIPTION_URL:http://localhost:8088}
