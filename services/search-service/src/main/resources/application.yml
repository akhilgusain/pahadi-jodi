server:
  port: 8085
spring:
  application:
    name: search-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pahadijodi}
    username: ${DB_USER:pj}
    password: ${DB_PASSWORD:pj_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: search
  flyway:
    schemas: search
    create-schemas: true
    locations: classpath:db/migration,classpath:db/outbox
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: search-service
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PJ_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
management:
  endpoints.web.exposure.include: health,info,prometheus
pj:
  kafka:
    consumers:
      enabled: ${PJ_KAFKA_CONSUMERS:true}
  outbox:
    relay:
      enabled: ${PJ_OUTBOX_RELAY:true}
  search:
    provider: ${PJ_SEARCH_PROVIDER:fake}        # fake = in-memory index | real = Elasticsearch
    dev-endpoints: false                          # PUT /api/v1/search/dev/index (never enable in prod)
    es:
      url: ${ES_URL:http://localhost:9200}
      api-key: ${ES_API_KEY:}                     # optional (Elastic Cloud); empty for local dev
      read-alias: pj-profiles-read
      write-alias: pj-profiles-write
      bootstrap-index: pj-profiles-v1
