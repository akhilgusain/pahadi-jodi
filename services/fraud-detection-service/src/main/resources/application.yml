server:
  port: 8096
spring:
  application:
    name: fraud-detection-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pahadijodi}
    username: ${DB_USER:pj}
    password: ${DB_PASSWORD:pj_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: fraud
  flyway:
    schemas: fraud
    create-schemas: true
    locations: classpath:db/migration,classpath:db/outbox
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: fraud-detection-service
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PJ_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
management:
  endpoints.web.exposure.include: health,info,prometheus
pj:
  outbox:
    relay:
      enabled: ${PJ_OUTBOX_RELAY:true}
  kafka:
    consumers:
      enabled: ${PJ_KAFKA_CONSUMERS:true}
  fraud:
    thresholds:        # score 0-100 -> action
      step-up: 30
      shadow-limit: 60
      block: 80
    photo:
      provider: fake   # fake = perceptual-hash comparison in our own DB; real = Rekognition / reverse image search (not implemented)
      max-hamming: 4
    text:
      max-hamming: 3
