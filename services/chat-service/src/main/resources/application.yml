server:
  port: 8086
spring:
  application:
    name: chat-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pahadijodi}
    username: ${DB_USER:pj}
    password: ${DB_PASSWORD:pj_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: chat
  flyway:
    schemas: chat
    create-schemas: true
    locations: classpath:db/migration,classpath:db/outbox
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: chat-service
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PJ_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
management:
  endpoints.web.exposure.include: health,info,prometheus
pj:
  kafka:
    consumers:
      enabled: ${PJ_KAFKA_CONSUMERS:true}
  outbox:
    relay:
      enabled: ${PJ_OUTBOX_RELAY:true}
  entitlement:
    provider: fake            # no real subscription-service adapter yet
  chat:
    policy:
      require-match: ${PJ_CHAT_REQUIRE_MATCH:true}   # chat only between mutually matched users
    ws:
      allowed-origins: ${PJ_WS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
    rtc:
      stun-urls: ${PJ_STUN_URLS:stun:stun.l.google.com:19302}
      turn-urls: ${PJ_TURN_URLS:}               # e.g. turn:turn.example.com:3478?transport=udp
      turn-secret: ${PJ_TURN_SECRET:}           # coturn static-auth-secret (ephemeral REST credentials)
      turn-ttl-seconds: 3600
    call:
      ring-timeout-seconds: 45
    topics:
      match-created: ${PJ_TOPIC_MATCH_CREATED:pj.match.created.v1}
    translator:
      provider: ${PJ_CHAT_TRANSLATOR:fake}      # fake | azure
      azure-endpoint: ${AZURE_OPENAI_ENDPOINT:}
      azure-api-key: ${AZURE_OPENAI_API_KEY:}
      azure-deployment: ${AZURE_OPENAI_DEPLOYMENT:}
