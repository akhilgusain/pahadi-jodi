server:
  port: 8083
spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pahadijodi}
    username: ${DB_USER:pj}
    password: ${DB_PASSWORD:pj_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: user_svc
  flyway:
    schemas: user_svc
    create-schemas: true
    locations: classpath:db/migration,classpath:db/outbox
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PJ_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
management:
  endpoints.web.exposure.include: health,info,prometheus
pj:
  kafka:
    consumers:
      enabled: ${PJ_KAFKA_CONSUMERS:true}
  user:
    erasure-grace-days: 30
  outbox:
    relay:
      enabled: ${PJ_OUTBOX_RELAY:true}
