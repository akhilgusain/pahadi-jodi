server:
  port: 8089
spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pahadijodi}
    username: ${DB_USER:pj}
    password: ${DB_PASSWORD:pj_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: payment
  flyway:
    schemas: payment
    create-schemas: true
    locations: classpath:db/migration,classpath:db/outbox
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PJ_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
management:
  endpoints.web.exposure.include: health,info,prometheus
pj:
  kafka:
    consumers:
      enabled: ${PJ_KAFKA_CONSUMERS:true}
  outbox:
    relay:
      enabled: ${PJ_OUTBOX_RELAY:true}
  payment:
    provider: ${PJ_PAYMENT_PROVIDER:fake}         # fake | real (Razorpay for INR, Stripe otherwise)
    dev-endpoints: ${PJ_PAYMENT_DEV_ENDPOINTS:false} # NEVER true in production
    seller-state-code: "05"                        # Uttarakhand; drives CGST+SGST vs IGST
    fake:
      webhook-secret: ${PJ_PAYMENT_FAKE_WEBHOOK_SECRET:fake-local-secret}
    reconciliation:
      enabled: true
      cron: "0 30 20 * * *"                        # 02:00 IST (UTC cron)
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      base-url: https://api.razorpay.com
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      base-url: https://api.stripe.com
