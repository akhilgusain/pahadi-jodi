# Zero-infrastructure local mode:  SPRING_PROFILES_ACTIVE=h2   (in-memory, data lost on restart)
spring:
  datasource:
    url: jdbc:h2:mem:payment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    properties:
      hibernate.default_schema: PUBLIC
  flyway:
    schemas: PUBLIC
    create-schemas: false
pj:
  kafka:
    consumers:
      enabled: false
  outbox:
    relay:
      enabled: false   # no Kafka in this mode; events accumulate in outbox_event
  payment:
    dev-endpoints: true   # fake "provider completes payment" endpoints
