server:
  port: 8095
spring:
  application:
    name: admin-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pahadijodi}
    username: ${DB_USER:pj}
    password: ${DB_PASSWORD:pj_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: admin
  flyway:
    schemas: admin
    create-schemas: true
    locations: classpath:db/migration,classpath:db/outbox
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PJ_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
management:
  endpoints.web.exposure.include: health,info,prometheus
pj:
  outbox:
    relay:
      enabled: ${PJ_OUTBOX_RELAY:true}
  admin:
    provider: ${PJ_ADMIN_PROVIDER:fake}      # fake = in-memory directory/KPIs; real = call downstream services with the admin's JWT
    auto-approve-max-days: 30                # bans longer than this (or permanent) need a second admin
    clients:
      user-url: ${PJ_USER_SERVICE_URL:http://localhost:8083}
      subscription-url: ${PJ_SUBSCRIPTION_SERVICE_URL:http://localhost:8088}
      payment-url: ${PJ_PAYMENT_SERVICE_URL:http://localhost:8089}
      fraud-url: ${PJ_FRAUD_SERVICE_URL:http://localhost:8096}
      moderation-url: ${PJ_MODERATION_SERVICE_URL:http://localhost:8092}
